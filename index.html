<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#f2f5fb">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kejohanan E-Sport MLBB – SMK Seri Rompin</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f2f5fb;--card:#fff;--line:#dbe2f1;--ink:#0f1a3d;--mut:#56628a;--c1:#2457ff;--c1d:#13216f;--c1t:#e8eeff;--c2:#be185d;--c3:#6d28d9;--ok:#0b8a45;--okt:#e3f6ec;--bad:#d62a4a;--badt:#fdebee;--gold:#9a5b00;--amb:#ffc21a;--ambt:#fff6dc;--sh:0 1px 2px rgba(15,26,61,.06),0 6px 18px rgba(15,26,61,.07);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;padding-bottom:84px;overflow-x:hidden}
h1,h2,h3,.disp{font-family:'Chakra Petch',Inter,sans-serif;margin:0}
main{max-width:1180px;margin:0 auto;padding:20px 16px}
#bg{position:fixed;inset:0;z-index:-2;background:var(--bgimg) center/cover no-repeat}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(242,245,251,.55),rgba(242,245,251,.9))}
.glass{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.pad{padding:18px}
h2{font-size:20px;margin-bottom:4px}
.sub{color:var(--mut);margin:0 0 12px;font-size:14px}
:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
/* hero: banner sudut dua-tona */
.hero{position:relative;overflow:hidden;padding:26px 24px;margin-bottom:16px;border:0;color:#fff;background:linear-gradient(115deg,var(--c1d) 0 62%,#1a3fd0 62% 100%)}
.hero::before,.hero::after{content:"";position:absolute;top:0;bottom:0;right:0;width:36%;pointer-events:none}
.hero::before{background:var(--amb);clip-path:polygon(24% 0,28% 0,4% 100%,0 100%)}
.hero::after{background:var(--c1);clip-path:polygon(28% 0,100% 0,100% 100%,4% 100%)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(24px,5vw,40px);line-height:1.15;color:#fff;max-width:20em}
.hero p{margin:6px 0 0;color:#cfd9ff}
.hero.himg{min-height:clamp(180px,32vw,360px);display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center}
.hero.himg::before,.hero.himg::after{display:none}
.hero.himg h1{text-shadow:0 2px 14px rgba(0,0,0,.6)}.hero.himg p{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--c1t);border:1px solid #c9d6ff;font-size:13px;font-weight:500;color:#1b3bb3}
.hero .chip{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px;border-left:5px solid var(--c1)}
.stat b{display:block;font:700 30px/1.1 'Chakra Petch',sans-serif;color:var(--ink)}
.stat span{color:var(--mut);font-size:13px;font-weight:500}
/* butang */
.btn{cursor:pointer;border:1px solid var(--c1);background:var(--c1);color:#fff;padding:10px 18px;border-radius:12px;font:600 14px Inter,sans-serif;transition:background .15s,box-shadow .15s,transform .1s}
.btn:hover{background:#1a46dd;box-shadow:0 4px 14px rgba(36,87,255,.35)}
.btn:active{transform:translateY(1px)}
.btn.pink{border-color:var(--ink);background:var(--ink)}.btn.pink:hover{background:#1c2a5e;box-shadow:0 4px 14px rgba(15,26,61,.3)}
.btn.red{border-color:#f3b4c0;background:var(--badt);color:var(--bad)}.btn.red:hover{background:var(--bad);color:#fff;box-shadow:none}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.4;pointer-events:none}
.hero .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.5);color:#fff}
.hero .btn:hover{background:#fff;color:var(--c1d);box-shadow:none}
/* borang */
input,select{width:100%;background:#fff;border:1px solid #c6d0e8;color:var(--ink);padding:10px 12px;border-radius:10px;font:inherit}
input:focus,select:focus{border-color:var(--c1);outline:none;box-shadow:0 0 0 3px rgba(36,87,255,.2)}
label{display:block;font-size:13px;font-weight:500;color:var(--mut);margin:12px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two{display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:16px;align-items:start}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sq{max-width:260px}
.team{padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.team .n{font:700 16px 'Chakra Petch',sans-serif}
.team small{color:var(--mut);display:block}
.empty{text-align:center;padding:36px 16px;color:var(--mut);background:var(--card);border:1px dashed #b9c5e4;border-radius:18px}
.empty h2{color:var(--ink)}
/* segmen & penapis */
.seg{display:inline-flex;gap:2px;padding:4px;margin:2px 0 14px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.seg button{border:0;background:none;color:var(--mut);padding:8px 18px;border-radius:10px;font:600 13px Inter,sans-serif;cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--c1);color:#fff}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{white-space:nowrap}
@media(max-width:560px){.seg button{padding:8px 11px;font-size:12.5px}}
.seg button[disabled]{opacity:.45;cursor:not-allowed}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.fl button{background:#fff;border:1px solid var(--line);color:var(--mut);padding:7px 14px;border-radius:99px;font:600 13px Inter,sans-serif;cursor:pointer;transition:.15s}
.fl button b{margin-left:8px;color:var(--ink)}
.fl button:hover{border-color:var(--c1);color:var(--c1)}
.fl button.on{background:var(--ink);border-color:var(--ink);color:#fff}.fl button.on b{color:var(--amb)}
/* warna pusingan */
.rc0{--rc:#0e7490}.rc1{--rc:#6d28d9}.rc2{--rc:#c2410c}.rc3{--rc:#1d4ed8}.rcF{--rc:#be185d}
.bdh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.bdh h2{font-size:22px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 12px;font-size:12px;font-weight:500;color:var(--mut)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:12px;height:12px;border-radius:4px;display:inline-block;background:var(--rc,var(--ok))}
.leg .lg i{background:var(--amb)}.leg .ld i{background:var(--ok)}.leg .lw i{background:#c3cce4}
/* tajuk pusingan */
.rs{margin-top:26px}
.rh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.rh .dot{width:12px;height:12px;border-radius:4px;background:var(--rc,var(--c1))}
.rh h3{font:700 17px 'Chakra Petch',sans-serif;letter-spacing:.04em;color:var(--ink)}
.rh .fm{font-size:12px;font-weight:600;color:var(--rc,var(--c1));padding:2px 9px;border-radius:99px;border:1px solid currentColor}
.rh .pg{margin-left:auto;font-size:12px;color:var(--mut)}.rh .pg b{color:var(--ink)}
.rh .bar{flex-basis:100%;height:4px;border-radius:4px;background:#dbe2f1;overflow:hidden}
.rh .bar i{display:block;height:100%;border-radius:4px;background:var(--rc,var(--c1));transition:width .4s}
.rem{font-size:12px;font-weight:600;color:var(--gold);padding:2px 10px;border-radius:99px;background:var(--ambt);border:1px solid #f1d27a}
.rh.fin .dot,.rh.fin .bar i{background:var(--ok)}
.rh.fin .pg{color:var(--ok);font-weight:600}
.chev{margin-left:10px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600}
.rh.fin:hover .chev{border-color:var(--c1);color:var(--c1)}
.dv{display:flex;align-items:center;gap:12px;margin:22px 0 14px;color:var(--ok);font:600 12px Inter,sans-serif}
.dv::before,.dv::after{content:"";flex:1;height:1px;background:var(--line)}
/* kad perlawanan (senarai) */
.lst{display:flex;flex-direction:column;gap:8px}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.mg.big{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:10px}
.mc{position:relative;padding:14px 14px 12px 20px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);transition:box-shadow .2s,border-color .2s}
.mc::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:0 5px 5px 0;background:var(--rc,var(--c1))}
.mc:hover{border-color:#b9c5e4;box-shadow:0 2px 4px rgba(15,26,61,.06),0 12px 28px rgba(15,26,61,.12)}
.mc-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.mc .no{font:700 16px 'Chakra Petch',sans-serif;color:var(--rc,var(--c1))}
.mc .tm{font-size:12px;font-weight:500;color:var(--mut)}
.gt{font:600 11px Inter,sans-serif;color:var(--c1);padding:1px 8px;border-radius:99px;background:var(--c1t)}
.rt{margin-left:auto;display:flex;align-items:center;gap:8px}
.fs{font:700 15px 'Chakra Petch',sans-serif;color:var(--c1d);background:var(--c1t);padding:2px 10px;border-radius:8px}
.pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font:600 11px Inter,sans-serif;white-space:nowrap}
.rt .pill{margin-left:0}
.pill.live{background:var(--amb);color:#3d2a00}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#3d2a00;animation:blink .6s ease-in-out infinite}
.pill.rdy{color:var(--c1);background:var(--c1t)}
.pill.dn{background:var(--okt);color:var(--ok)}
.pill.wt{color:var(--mut);border:1px dashed #b3bfdc}
.tr{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:9px 10px;margin-top:6px;border-radius:12px;background:#f4f7fd;cursor:pointer;transition:background .15s}
.tr:hover{background:#e8eeff}
.tr .nm{font:600 15px/1.25 Inter,sans-serif;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.tr .sc{font:700 20px 'Chakra Petch',sans-serif;min-width:22px;text-align:right;color:var(--ink)}
.tr.w{background:var(--okt)}.tr.w .nm{color:#06592c;font-weight:700}.tr.w .nm::after{content:" ✔";color:var(--ok);font-size:12px}.tr.w .sc{color:var(--ok)}
.tr.l .nm,.tr.l .sc{color:#6b7799;font-weight:500}
.tr.p{cursor:default;background:transparent;border:1px dashed #b3bfdc}.tr.p .nm{color:var(--mut);font-style:italic;font-weight:500}
.av{font:700 10px 'Chakra Petch',sans-serif;font-style:normal;width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c3))}
.av.ph{background:none;border:1px dashed #b3bfdc;color:var(--mut)}
.tn{display:flex;align-items:center;gap:8px;min-width:0}
.mc.big .tr{padding:12px}.mc.big .nm{font-size:18px}.mc.big .av{width:34px;height:34px;font-size:12px}.mc.big .no{font-size:18px}
.pub .mc .nm{font-size:18px}
.mc.nx{border-color:var(--amb)}
.mc.nx::before{background:var(--amb)}.mc.nx .no{color:var(--gold)}
.mc.dn{background:#f6f8fc;box-shadow:none}.mc.dn .no{color:var(--mut)}.mc.dn .tr{background:#eef2fa}.mc.dn .tr.w{background:var(--okt)}
.mc.hl,.m.hl{border-color:var(--c1);box-shadow:0 0 0 3px rgba(36,87,255,.28);animation:none}
.mc.dim,.m.dim{opacity:.35}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
@keyframes sheen{from{background-position:160% 0,0 0}to{background-position:-60% 0,0 0}}
@keyframes ring{0%,100%{box-shadow:0 0 3px rgba(255,170,0,.7),0 0 8px rgba(255,194,26,.45),var(--sh)}50%{box-shadow:0 0 8px #ffb300,0 0 24px rgba(255,170,0,.85),0 0 48px rgba(255,194,26,.55),var(--sh)}}
@keyframes blink{50%{opacity:.2}}
.mc.nx,.m.nx{position:relative;background:linear-gradient(110deg,transparent 40%,rgba(255,194,26,.4) 50%,transparent 60%) 0 0/250% 100% no-repeat,linear-gradient(180deg,var(--ambt),#fff 75%) 0 0/100% 100% no-repeat;animation:ring .7s ease-in-out infinite,sheen 1.3s linear infinite}
.mc.nx::after,.m.nx::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:3px;pointer-events:none;background:conic-gradient(from var(--a),transparent 0 22%,#ffc21a 42%,#ff8a00 50%,transparent 50% 72%,#ffc21a 92%,#ff8a00 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);filter:drop-shadow(0 0 4px #ffb300);animation:spin 1.2s linear infinite}
.m.nx .mh .go{animation:blink .6s ease-in-out infinite}
.mc.nx.hl,.m.nx.hl{animation:none}.mc.nx.hl::after,.m.nx.hl::after{display:none}
/* bracket */
.bracket{--ln:#b9c4e0;display:flex;gap:32px;align-items:stretch;overflow-x:auto;padding:26px 30px 34px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.col{min-width:250px;display:flex;flex-direction:column;flex:1}
.col h3{font-size:13px;text-align:center;height:46px;padding:3px 6px;margin-bottom:10px;border-radius:10px;color:#fff;background:var(--rc,var(--c1))}
.col h3 small{display:block;font:500 11px Inter,sans-serif;color:rgba(255,255,255,.85)}
.cb{flex:1;display:flex;flex-direction:column}
.pair,.slot{flex:1;display:flex;flex-direction:column;justify-content:space-around;position:relative}
.slot{justify-content:center}
.pair::after{content:"";position:absolute;right:-16px;top:25%;height:50%;width:16px;border:2px solid var(--ln);border-left:0}
.pair::before{content:"";position:absolute;right:-32px;top:50%;width:16px;border-top:2px solid var(--ln)}
.mw{margin:7px 0}
.m{border:1px solid var(--line);border-left:5px solid var(--rc,var(--c1));border-radius:12px;background:#fff;overflow:hidden;box-shadow:var(--sh)}
.mh{display:flex;justify-content:space-between;padding:4px 12px;font-size:11px;font-weight:600;color:var(--mut);background:#f1f4fb}
.mh .rdy{color:var(--c1)}
.s{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;font-weight:500}
.s+.s{border-top:1px solid var(--line)}
.s:hover{background:#f4f7fd}
.s.w{background:var(--okt);color:#06592c;font-weight:700}
.s.l{color:#6b7799;text-decoration:line-through}
.s.t{cursor:default;color:var(--mut);font-style:italic}
.mt{font-size:11px;color:var(--mut);padding:3px 12px;border-top:1px solid var(--line)}
.m.nx{border-color:var(--amb);border-left-color:var(--amb)}
.m.nx .mh{background:var(--amb);color:#3d2a00}.m.nx .mh .go{font-weight:700;color:#3d2a00}
.m.dn{background:#f6f8fc;box-shadow:none}.m.dn .mh{color:var(--ok)}.m.dn .s.l{text-decoration:none}
.pub .s{font-size:17px;padding:11px 14px}.pub .col{min-width:270px}
/* jadual kedudukan */
.gbox{--gc:#0e7490;margin:18px 0 22px;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:24px 0 10px;font:700 15px 'Chakra Petch',sans-serif;letter-spacing:.04em;color:var(--ink)}
.gh span{font:500 12px Inter,sans-serif;color:var(--mut);letter-spacing:0}
.gbox .gh{margin:0;padding:12px 16px;background:var(--gc);color:#fff;font-size:18px;align-items:center;justify-content:space-between}
.gbox .gh span{color:#fff;font-weight:600;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:99px}
.tbw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.gbox .tbw{border:0;border-radius:0}
.tb{width:100%;border-collapse:collapse;min-width:540px}
.tb th{font:600 12px Inter,sans-serif;color:#33406b;background:#eef2fb;padding:12px 8px;border-bottom:1px solid var(--line)}
.tb td{padding:12px 8px;text-align:center;border-bottom:1px solid #e8edf7;font:600 16px Inter,sans-serif;color:var(--ink)}
.tb tr:last-child td{border-bottom:0}
.tb tbody tr{cursor:pointer;transition:background .15s}
.tb tbody tr:nth-child(even) td{background:#f8faff}
.tb tbody tr:hover td{background:#eaf0ff}
.tb th:nth-child(2),.tb td:nth-child(2){text-align:left}
.tb .rk{font:700 19px 'Chakra Petch',sans-serif;width:46px;color:var(--mut)}
.tb .tn b{display:block;font-weight:700}.tb .tn small{color:var(--mut);font-weight:400;font-size:12px}
.tb .pt{font:700 24px 'Chakra Petch',sans-serif;color:var(--c1)}
.tb tr.q td{background:var(--okt)!important}
.tb tr.q td:first-child{box-shadow:inset 6px 0 var(--ok)}
.tb tr.q .rk{color:var(--ok)}
.tb tr.q+tr:not(.q) td{border-top:3px dashed var(--bad)}
.tb tr.hl td{background:#d6e2ff!important}.tb tr.dim{opacity:.35}
.qb{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:99px;background:var(--ok);color:#fff;font:700 10px Inter,sans-serif;letter-spacing:.04em;vertical-align:middle}
.gnote{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 4px;color:var(--mut);font-size:13px}
.gnote i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.fmtbox{margin:12px 0;padding:14px 16px;border-radius:14px;background:#f4f7fd;border:1px solid var(--line)}
.fmtbox h3{margin:0 0 6px;font:700 15px 'Chakra Petch',sans-serif}
.fmtsum{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
/* pengesahan */
.rn{display:flex;justify-content:space-between;gap:8px;font:700 14px 'Chakra Petch',sans-serif;color:var(--rc,var(--ink));background:#fff;border:1px solid var(--line);border-left:5px solid var(--rc,var(--c1));padding:8px 14px;border-radius:10px;margin:18px 0 10px}
.vs{padding:16px;margin-bottom:12px}
.vs.cur{border:2px solid var(--ok)}
.vs.nxt{border-style:dashed;opacity:.8}.vs.nxt:hover,.vs.nxt:focus-within{opacity:1}
.nxrow{opacity:.85}
.vs .vh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font:700 12px 'Chakra Petch',sans-serif;color:var(--mut)}
.vs .badge{padding:3px 10px;border-radius:99px;white-space:nowrap}
.vs .badge.cur{background:var(--okt);color:var(--ok)}.vs .badge.nxt{background:#eef2fb;color:var(--mut)}
.vs .tt{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.vs .tt b{font:700 17px 'Chakra Petch',sans-serif}
.vs .x{color:var(--c2);font-weight:700}
.sc{width:64px;margin:8px auto 0;text-align:center}
.win{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.gate{padding:18px;margin:14px 0;text-align:center;background:var(--okt);border:2px solid var(--ok)}.gate h2{margin:0 0 6px;color:#06592c}
.champ{padding:22px;text-align:center;margin-bottom:16px;background:linear-gradient(180deg,var(--ambt),#fff);border:2px solid var(--amb)}
.champ h2{font-size:clamp(22px,5vw,34px);color:#7a4a00}
/* nav, toast, dialog */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);box-shadow:0 -4px 20px rgba(15,26,61,.08);z-index:5}
nav button{flex:1;max-width:200px;background:none;border:0;color:var(--mut);padding:8px 4px;border-radius:12px;cursor:pointer;font:600 12px Inter,sans-serif;transition:background .15s,color .15s}
nav button i{display:block;font-style:normal;font-size:18px}
nav button:hover{background:#f1f4fb;color:var(--ink)}
nav button.on{background:var(--c1);color:#fff}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:500;padding:10px 18px;border-radius:12px;z-index:30;box-shadow:0 8px 24px rgba(15,26,61,.3)}
.ov{position:fixed;inset:0;background:rgba(15,26,61,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dlg{max-width:380px;width:100%;box-shadow:0 20px 50px rgba(15,26,61,.3)}.dlg p{margin:0 0 16px;white-space:pre-line}
.fsb{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:9;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:20px;cursor:pointer;box-shadow:var(--sh)}
.fsb:hover{border-color:var(--c1);color:var(--c1)}
body.pres #app{zoom:1.2;padding-bottom:24px}body.pres .fsb{opacity:.45}body.pres .fsb:hover{opacity:1}
@media(max-width:760px){.two{grid-template-columns:1fr}.col{min-width:200px}.hero::before,.hero::after{width:22%}}
@media(min-width:900px){nav{top:0;bottom:auto;padding:10px 16px;border-top:0;border-bottom:1px solid var(--line);box-shadow:0 4px 20px rgba(15,26,61,.06)}
nav button{flex:none;min-width:140px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px}nav button i{display:inline;font-size:16px}
body{padding-top:68px;padding-bottom:28px}}
@media print{body{background:#fff;padding:0}#bg,nav,.noprint,.fsb{display:none}.glass,.mc,.m,.hero{box-shadow:none;animation:none;background:#fff;color:#000;border:1px solid #999}.hero::before,.hero::after,.mc::before,.mc::after,.m::after{display:none}.hero h1,.hero p{color:#000;text-shadow:none}.mc *,.m *{color:#000!important}.tr,.pill{background:none!important}.rh .bar{display:none}.bracket{box-shadow:none}.col h3{background:#fff;color:#000;border:1px solid #999}.col h3 small{color:#000}}

/* ===== bracket gaya turnamen profesional ===== */
@keyframes flash{50%{opacity:.3}}
.bracket{scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:#b9c4e0 transparent;background:linear-gradient(#fff,#fff) padding-box,#fff}
.col{scroll-snap-align:start}
.col h3{box-shadow:0 2px 0 rgba(15,26,61,.12)}
.col.cur h3{outline:3px solid rgba(255,194,26,.9);outline-offset:2px;animation:ring .7s ease-in-out infinite}
.col.cur h3 small::before{content:"● ";color:var(--amb);animation:blink .6s ease-in-out infinite}
.pair.hot::before,.pair.hot::after{border-color:#ff9f00;filter:drop-shadow(0 0 3px #ffb300);animation:flash .7s ease-in-out infinite}
.pair.fin::before,.pair.fin::after{border-color:#5fcf93}
.m{transition:transform .15s,box-shadow .15s}
.m:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(15,26,61,.06),0 10px 24px rgba(15,26,61,.14)}
.s>span:last-child{min-width:30px;text-align:center;font:700 15px 'Chakra Petch',sans-serif;background:#eef2fb;border-radius:6px;padding:1px 7px}
.s>span:last-child:empty{display:none}
.s.w>span:last-child{background:var(--ok);color:#fff}
.s.t>span:last-child{min-width:0;padding:0;background:none;font:inherit;text-align:left}
.s .tn{font-size:14px}
.s .av{width:24px;height:24px;border-radius:7px}
.bracket::-webkit-scrollbar{height:8px}.bracket::-webkit-scrollbar-thumb{background:#b9c4e0;border-radius:8px}
.tb td,.tr .sc,.stat b,.fs{font-variant-numeric:tabular-nums}
.hero h1{text-wrap:balance}

/* ===== logo kumpulan ===== */
.av.lg{background:none;border:0;border-radius:0;width:32px;height:32px;display:block;filter:drop-shadow(0 1px 2px rgba(15,26,61,.35))}
.av.lg svg{display:block;width:100%;height:100%}
.mc.big .av.lg{width:46px;height:46px}
.s .av.lg{width:28px;height:28px}
.tl{display:flex;align-items:center;gap:12px;min-width:0}.tl .av.lg{width:40px;height:40px;flex:none}
.tb td.tn{display:table-cell}
.tb .av.lg{display:inline-block;vertical-align:middle;width:28px;height:28px;margin-right:8px}
.av.xl{width:88px;height:88px;margin:0 auto 8px}
.av.lgv{width:58px;height:58px;margin:0 auto 6px}
.bracket{scroll-padding-left:30px}

.imcap{margin:10px 0 0;font-size:13px;font-weight:500;color:var(--mut);text-align:center}
.hero .imcap{color:#e3eaff;text-align:left;margin:6px 0 0}
.impanel{margin:0 0 14px}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--c1);height:28px}
.ppad{display:grid;grid-template-columns:repeat(3,34px);gap:6px}
.ppad button{width:34px;height:34px;border-radius:8px;border:1px solid #c6d0e8;background:#fff;cursor:pointer;padding:0}
.ppad button:hover{border-color:var(--c1)}
.ppad button.on{background:var(--c1);border-color:var(--c1);box-shadow:inset 0 0 0 4px #fff}
.mth{width:100%;max-width:240px;aspect-ratio:16/9;border-radius:10px;border:1px dashed #b9c5e4;background:#eef2fb center/cover no-repeat;margin:8px 0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px}
body.imgbg #bg::after{background:linear-gradient(180deg,rgba(242,245,251,.15),rgba(242,245,251,.6))}
.gt2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.gt2{grid-template-columns:1fr}}
.rulebox{background:var(--ambt);border:1px solid #f1d27a;border-radius:14px;padding:14px 16px;margin:4px 0 14px}.rulebox h3{margin:0 0 4px;font-size:16px}.rulebox ol{margin:0 0 10px;padding-left:20px;font-size:14px;line-height:1.55}.rulebox li{margin-bottom:6px}.ackl{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:600;font-size:14px}.ackl input{width:20px;height:20px;margin:2px 0 0;flex:none}
/* ===== pilihan paparan: Auto / Telefon / Desktop ===== */
body.v-phone main{max-width:460px}
body.v-phone .two,body.v-phone .gt2{grid-template-columns:1fr}
body.v-phone .hero::before,body.v-phone .hero::after{width:22%}
body.v-phone{padding-top:0;padding-bottom:84px}
body.v-phone nav{top:auto;bottom:0;left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:460px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-bottom:0;box-shadow:0 -4px 20px rgba(15,26,61,.06)}
body.v-phone nav button{flex:1;min-width:0;display:block;font-size:12px}
body.v-phone nav button i{display:block;font-size:18px}
body.v-phone .fsb{right:max(10px,calc(50% - 230px + 10px))}
body.v-desk .two{grid-template-columns:minmax(0,380px) 1fr}
body.v-desk .gt2{grid-template-columns:1fr 1fr}
body.v-desk nav{top:0;bottom:auto;padding:10px 16px;border-top:0;border-bottom:1px solid var(--line);box-shadow:0 4px 20px rgba(15,26,61,.06)}
body.v-desk nav button{flex:none;min-width:140px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px}
body.v-desk nav button i{display:inline;font-size:16px}
body.v-desk{padding-top:68px;padding-bottom:28px}
.vmb{right:64px}body.v-phone .vmb{right:max(64px,calc(50% - 230px + 64px))}
.vmm{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));right:10px;z-index:40;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(15,26,61,.2);padding:6px;min-width:190px}
.vmm[hidden]{display:none}
.vmm p{margin:4px 8px 6px;font:600 12px Inter,sans-serif;color:var(--mut)}
.vmm button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font:600 14px Inter,sans-serif;color:var(--ink);cursor:pointer}
.vmm button:hover{background:#f1f4fb}.vmm button.on{background:var(--c1);color:#fff}
.okb{margin:8px 0 12px;padding:12px 14px;border-radius:12px;background:var(--ambt);border:1px solid #f1d27a;display:flex;flex-direction:column;gap:6px}
.okb small{color:var(--mut);font-size:13px}
.okb .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.okb .row input{flex:1;min-width:150px;margin:0}
.okb.ok{background:var(--okt);border-color:#9fdcb9;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.okb.ok b{color:var(--ok);display:block}
.okl{padding:6px 14px 10px;font-size:12px;font-weight:600;color:var(--ok)}
.vs input.sc[disabled],.win .btn[disabled]{opacity:.45;cursor:not-allowed}
.okf{padding:4px 14px 14px;display:flex;justify-content:flex-end}.okf .btn:not(.sm){width:100%}
/* ===== Podium & upacara juara ===== */
.cer{position:fixed;inset:0;z-index:60;display:flex;padding:20px;overflow:auto;color:#fff;text-align:center;background:radial-gradient(ellipse at 50% 15%,#4a35b0 0,#18205a 45%,#070b24 100%);animation:cerin .7s ease both}
@keyframes cerin{from{opacity:0}to{opacity:1}}
.cer::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 22%,rgba(255,215,94,.28),rgba(255,215,94,0) 55%);animation:glow 4s ease-in-out infinite;pointer-events:none}
@keyframes glow{50%{opacity:.55}}
.cer-in{position:relative;width:min(960px,100%);margin:auto;padding:10px 0 24px}
.cx{position:absolute;top:-4px;right:0;z-index:2;width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:18px;cursor:pointer}
.cer-k{letter-spacing:.35em;font:600 clamp(11px,1.6vw,15px) 'Chakra Petch',sans-serif;color:#ffe08a}
.cer h1{margin:6px 0 4px;font:800 clamp(34px,min(9vw,11vh),88px)/1 'Chakra Petch',sans-serif;background:linear-gradient(90deg,#ffe08a,#ffb300,#fff2c2,#ffb300,#ffe08a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen2 4s linear infinite}
@keyframes sheen2{to{background-position:-200% 0}}
.cer-s{margin:0 0 6px;color:#b8c4f0;font-size:clamp(13px,1.8vw,18px)}
.cer-b{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,22px);width:100%;margin:26px auto 0}
.pc{flex:1;min-width:0;max-width:300px;display:flex;flex-direction:column;align-items:center}
.pc .who{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:12px;opacity:0;transform:translateY(24px);animation:pup .7s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes pup{to{opacity:1;transform:none}}
.pc.p3 .who{animation-delay:.9s}.pc.p2 .who{animation-delay:1.8s}.pc.p1 .who{animation-delay:2.8s}
.pc .crown{font-size:clamp(28px,5vw,48px);line-height:1;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.pc .pt1{display:flex;flex-direction:column;align-items:center;gap:4px}
.pod .av.lg{width:clamp(54px,10vw,92px);height:clamp(54px,10vw,92px);margin:0 auto}
.pc.p1 .av.lg{width:clamp(70px,13vw,120px);height:clamp(70px,13vw,120px);filter:drop-shadow(0 0 18px rgba(255,215,94,.85))}
.pc .pt1 b{font:700 clamp(15px,2.6vw,26px)/1.15 'Chakra Petch',sans-serif;word-break:break-word}
.pc.p1 .pt1 b{font-size:clamp(20px,3.8vw,40px);color:#ffe08a}
.pc .pt1 small{color:#b8c4f0;font-size:clamp(11px,1.4vw,15px);max-width:280px}
.pc .rl{padding:4px 12px;border-radius:99px;font:700 clamp(10px,1.4vw,13px) 'Chakra Petch',sans-serif;letter-spacing:.12em;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
.pc.p1 .rl{background:linear-gradient(90deg,#ffd75e,#ffb300);color:#3d2a00;border:0}
.pc .bar{width:100%;border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font:800 clamp(30px,6vw,60px) 'Chakra Petch',sans-serif;color:rgba(255,255,255,.9);transform-origin:bottom;transform:scaleY(0);animation:grow .9s cubic-bezier(.2,.9,.3,1.05) forwards;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
@keyframes grow{to{transform:scaleY(1)}}
.pc.p1 .bar{height:clamp(110px,24vh,250px);background:linear-gradient(180deg,#ffd75e,#a8740a);animation-delay:2s;color:#5a3b00}
.pc.p2 .bar{height:clamp(80px,17vh,180px);background:linear-gradient(180deg,#e8ecf6,#8794b0);animation-delay:1.1s;color:#3b4560}
.pc.p3 .bar{height:clamp(60px,11vh,125px);background:linear-gradient(180deg,#e3a96f,#84451a);animation-delay:.2s}
@media(prefers-reduced-motion:reduce){.pc .who,.pc .bar,.cer h1,.cer::before{animation:none!important;opacity:1;transform:none}}
/* ===== Mod TV ===== */

body.tv.tvmv{cursor:auto}
body.tv #bg,body.tv .fsb,body.tv .vmm{display:none!important}

.tvpod{display:flex;justify-content:center}.tvpod .pod{max-width:1000px}

.tvx{animation:tvbl 1s steps(1) infinite;text-shadow:0 0 28px rgba(255,194,26,.95)}@keyframes tvbl{0%,100%{opacity:1;color:#ffc21a}50%{opacity:.2;color:#fff2b0}}

.tvwn{padding:3px 16px;border-radius:99px;background:#ffc21a;color:#3d2a00}

.tvf{will-change:transform}
.tvteam{transition:box-shadow .7s,border-color .7s,background .7s}

.tv .gbox{margin:0}.tvf.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tvf.g2>.gnote,.tvf.g2>.sub{grid-column:1/-1}

.tvx{font:700 clamp(30px,5vw,80px) 'Chakra Petch',sans-serif;color:#ffc21a}@keyframes tvpl{50%{transform:scale(1.18)}}
.tvwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}

.tvteam .av.lg{width:64px;height:64px}.tvteam b{font:700 clamp(15px,1.5vw,22px) 'Chakra Petch',sans-serif}.tvteam small{color:#9fb0ee}
.tvst{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}

let tab='jadual',edit=null,drafts=[],scanning=false,pubMode=(location.hash=='#paparan'||location.hash=='#tv'),pubData=null,dbh=null,canPush=false,pubStarted=false,pt;

function genGrp(t){
  const G=+S.set.G||4,adv=+S.set.adv||2,n=t.length;
  if(n<2*G){toast('Terlalu banyak kumpulan: perlukan sekurang-kurangnya '+2*G+' pasukan');return false}
  const gm=Array.from({length:G},()=>[]);t.forEach((id,i)=>gm[i%G].push(id));
  const lr=gm.map(ids=>{const q=ids.slice();if(q.length%2)q.push(null);const m=q.length,rs=[];for(let r=0;r<m-1;r++){const ms=[];for(let i=0;i<m/2;i++){const a=q[i],b=q[m-1-i];if(a&&b)ms.push([a,b])}rs.push(ms);q.splice(1,0,q.pop())}return rs});
  /* Susun semula supaya SEMUA kumpulan bermain serentak dalam setiap pusingan:

  let GR=Math.max(...lr.map(x=>x.length));
  const bal=lr.map(rs=>{const list=rs.flat(),M=list.length,out=[];
    const take=q=>{const used=new Set(),pick=[];for(let j=0;j<list.length&&pick.length<q;){const [a,b]=list[j];if(!used.has(a)&&!used.has(b)){pick.push(list.splice(j,1)[0]);used.add(a);used.add(b)}else j++}return pick};
    for(let r=0;r<GR;r++)out.push(take(Math.floor((r+1)*M/GR)-Math.floor(r*M/GR)));

  for(let r=0,c=size/2;c>=1;r++,c/=2)S.rounds.push(Array.from({length:c},(_,i)=>({r:GR+r,i,a:null,b:null,w:null,sa:'',sb:'',time:'',bye:false})));

function fillKO(){
  if(!grp())return;const GR=gcount(),k0=S.rounds[GR];if(!k0)return;

    m.a=id(m.sd[0]);m.b=id(m.sd[1]);if(m.bye&&!m.w)adv(m,m.a||m.b)})}
function gen(){

  if(grp()){if(!genGrp(t))return}else if(pts()){const q=t.slice();if(q.length%2)q.push(null);const n=q.length;S.rounds=[];
    for(let r=0;r<n-1;r++){const ms=[];for(let i=0;i<n/2;i++){const a=q[i],b=q[n-1-i];if(a&&b)ms.push({r,i:ms.length,a,b,w:null,sa:'',sb:'',time:'',bye:false})}S.rounds.push(ms);q.splice(1,0,q.pop())}

}
function slot(m,side){const id=m[side],w=m.w;

  S.rounds.forEach((rd,r)=>{const ms=rd.filter(m=>!m.bye);if(!ms.length)return;const sh=ms.filter(ok);if(!sh.length)return;any=true;

function standings(g){

    let sa=+m.sa||0,sb=+m.sb||0;if(!sa&&!sb){if(m.w===m.a)sa=1;else sb=1}

  const T=[['jadual','🏆','Jadual'],['daftar','👥','Pendaftaran'],['sah','✅','Pengesahan'],['set','⚙️','Setting'],['tv','🎬','Mod TV'],['out','🚪','Keluar']];
  document.getElementById('nav').innerHTML=T.map(([k,i,n])=>`<button class="${tab==k?'on':''}" onclick="${k=='tv'?'tvEnter()':`go('${k}')`}"><i>${i}</i>${n}</button>`).join('');
  const bk=bakAll(),bn=(!S.teams.length&&!S.rounds&&bk.length&&tab!='set')?`<div class="glass gate"><h2>⚠️ Tiada data dalam sistem</h2><p class="sub">Terdapat ${bk.length} sandaran. Terkini: ${e(bk[0].label)} (${bakT(bk[0].t)}) · ${bk[0].tm} kumpulan · ${bk[0].done}/${bk[0].tot} perlawanan selesai.</p><div class="row"><button class="btn pink" onclick="bakRestore('${bk[0].id}')">♻ Pulihkan sandaran terkini</button><button class="btn" onclick="go('set')">Lihat semua sandaran</button></div></div>`:'';
  document.getElementById('app').innerHTML=bn+{jadual:viewJadual,daftar:viewDaftar,sah:viewSah,set:viewSet}[tab]()}
tvSet();render();
</script>
</body>
</html>
