<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#f2f5fb">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kejohanan E-Sport MLBB – SMK Seri Rompin</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f2f5fb;--card:#fff;--line:#dbe2f1;--ink:#0f1a3d;--mut:#56628a;--c1:#2457ff;--c1d:#13216f;--c1t:#e8eeff;--c2:#be185d;--c3:#6d28d9;--ok:#0b8a45;--okt:#e3f6ec;--bad:#d62a4a;--badt:#fdebee;--gold:#9a5b00;--amb:#ffc21a;--ambt:#fff6dc;--sh:0 1px 2px rgba(15,26,61,.06),0 6px 18px rgba(15,26,61,.07);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;padding-bottom:84px;overflow-x:hidden}
h1,h2,h3,.disp{font-family:'Chakra Petch',Inter,sans-serif;margin:0}
main{max-width:1180px;margin:0 auto;padding:20px 16px}
#bg{position:fixed;inset:0;z-index:-2;background:var(--bgimg) center/cover no-repeat}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(242,245,251,.55),rgba(242,245,251,.9))}
.glass{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.pad{padding:18px}
h2{font-size:20px;margin-bottom:4px}
.sub{color:var(--mut);margin:0 0 12px;font-size:14px}
:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
/* hero: banner sudut dua-tona */
.hero{position:relative;overflow:hidden;padding:26px 24px;margin-bottom:16px;border:0;color:#fff;background:linear-gradient(115deg,var(--c1d) 0 62%,#1a3fd0 62% 100%)}
.hero::before,.hero::after{content:"";position:absolute;top:0;bottom:0;right:0;width:36%;pointer-events:none}
.hero::before{background:var(--amb);clip-path:polygon(24% 0,28% 0,4% 100%,0 100%)}
.hero::after{background:var(--c1);clip-path:polygon(28% 0,100% 0,100% 100%,4% 100%)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(24px,5vw,40px);line-height:1.15;color:#fff;max-width:20em}
.hero p{margin:6px 0 0;color:#cfd9ff}
.hero.himg{min-height:clamp(180px,32vw,360px);display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center}
.hero.himg::before,.hero.himg::after{display:none}
.hero.himg h1{text-shadow:0 2px 14px rgba(0,0,0,.6)}.hero.himg p{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--c1t);border:1px solid #c9d6ff;font-size:13px;font-weight:500;color:#1b3bb3}
.hero .chip{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px;border-left:5px solid var(--c1)}
.stat b{display:block;font:700 30px/1.1 'Chakra Petch',sans-serif;color:var(--ink)}
.stat span{color:var(--mut);font-size:13px;font-weight:500}
/* butang */
.btn{cursor:pointer;border:1px solid var(--c1);background:var(--c1);color:#fff;padding:10px 18px;border-radius:12px;font:600 14px Inter,sans-serif;transition:background .15s,box-shadow .15s,transform .1s}
.btn:hover{background:#1a46dd;box-shadow:0 4px 14px rgba(36,87,255,.35)}
.btn:active{transform:translateY(1px)}
.btn.pink{border-color:var(--ink);background:var(--ink)}.btn.pink:hover{background:#1c2a5e;box-shadow:0 4px 14px rgba(15,26,61,.3)}
.btn.red{border-color:#f3b4c0;background:var(--badt);color:var(--bad)}.btn.red:hover{background:var(--bad);color:#fff;box-shadow:none}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.4;pointer-events:none}
.hero .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.5);color:#fff}
.hero .btn:hover{background:#fff;color:var(--c1d);box-shadow:none}
/* borang */
input,select{width:100%;background:#fff;border:1px solid #c6d0e8;color:var(--ink);padding:10px 12px;border-radius:10px;font:inherit}
input:focus,select:focus{border-color:var(--c1);outline:none;box-shadow:0 0 0 3px rgba(36,87,255,.2)}
label{display:block;font-size:13px;font-weight:500;color:var(--mut);margin:12px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two{display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:16px;align-items:start}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sq{max-width:260px}
.team{padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.team .n{font:700 16px 'Chakra Petch',sans-serif}
.team small{color:var(--mut);display:block}
.empty{text-align:center;padding:36px 16px;color:var(--mut);background:var(--card);border:1px dashed #b9c5e4;border-radius:18px}
.empty h2{color:var(--ink)}
/* segmen & penapis */
.seg{display:inline-flex;gap:2px;padding:4px;margin:2px 0 14px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.seg button{border:0;background:none;color:var(--mut);padding:8px 18px;border-radius:10px;font:600 13px Inter,sans-serif;cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--c1);color:#fff}
.catpick{margin-bottom:16px}.cpg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.cpc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;border:2px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;font:500 13px Inter,sans-serif;color:var(--ink);text-align:center;transition:border-color .15s,background .15s,transform .1s}
.cpc:hover{transform:translateY(-2px)}.cpc i{font-style:normal;font-size:40px;line-height:1}.cpc b{font-size:17px;letter-spacing:.05em}.cpc em{font-style:normal;font-size:12px;color:var(--mut)}
.cpc u{text-decoration:none;margin-top:6px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;background:#eef2ff;color:var(--c1)}
.cpc[data-c=P] u{background:#fce7f3;color:#be185d}
.cpc[data-c=L].on{border-color:var(--c1);background:#eef3ff}.cpc[data-c=L].on u{background:var(--c1);color:#fff}
.cpc[data-c=P].on{border-color:#be185d;background:#fdf0f6}.cpc[data-c=P].on u{background:#be185d;color:#fff}
.catban{padding:10px 14px;border-radius:12px;margin:0 0 10px;font-size:14px;background:#eef3ff;border:1px solid #c7d4ff;color:#1d3fcc}
.catban[data-c=P]{background:#fdf0f6;border-color:#f6c0d9;color:#9d174d}
@media(max-width:480px){.cpc i{font-size:32px}.cpc b{font-size:15px}.cpc{padding:12px 6px}}
.seg.catsw{display:flex;width:100%}.seg.catsw button{flex:1;padding:10px 12px;font-size:14px}.seg.catsw button[data-c=P].on{background:#be185d}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{white-space:nowrap}
@media(max-width:560px){.seg button{padding:8px 11px;font-size:12.5px}}
.seg button[disabled]{opacity:.45;cursor:not-allowed}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.fl button{background:#fff;border:1px solid var(--line);color:var(--mut);padding:7px 14px;border-radius:99px;font:600 13px Inter,sans-serif;cursor:pointer;transition:.15s}
.fl button b{margin-left:8px;color:var(--ink)}
.fl button:hover{border-color:var(--c1);color:var(--c1)}
.fl button.on{background:var(--ink);border-color:var(--ink);color:#fff}.fl button.on b{color:var(--amb)}
/* warna pusingan */
.rc0{--rc:#0e7490}.rc1{--rc:#6d28d9}.rc2{--rc:#c2410c}.rc3{--rc:#1d4ed8}.rcF{--rc:#be185d}
.bdh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.bdh h2{font-size:22px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 12px;font-size:12px;font-weight:500;color:var(--mut)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:12px;height:12px;border-radius:4px;display:inline-block;background:var(--rc,var(--ok))}
.leg .lg i{background:var(--amb)}.leg .ld i{background:var(--ok)}.leg .lw i{background:#c3cce4}
/* tajuk pusingan */
.rs{margin-top:26px}
.rh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.rh .dot{width:12px;height:12px;border-radius:4px;background:var(--rc,var(--c1))}
.rh h3{font:700 17px 'Chakra Petch',sans-serif;letter-spacing:.04em;color:var(--ink)}
.rh .fm{font-size:12px;font-weight:600;color:var(--rc,var(--c1));padding:2px 9px;border-radius:99px;border:1px solid currentColor}
.rh .pg{margin-left:auto;font-size:12px;color:var(--mut)}.rh .pg b{color:var(--ink)}
.rh .bar{flex-basis:100%;height:4px;border-radius:4px;background:#dbe2f1;overflow:hidden}
.rh .bar i{display:block;height:100%;border-radius:4px;background:var(--rc,var(--c1));transition:width .4s}
.rem{font-size:12px;font-weight:600;color:var(--gold);padding:2px 10px;border-radius:99px;background:var(--ambt);border:1px solid #f1d27a}
.rh.fin .dot,.rh.fin .bar i{background:var(--ok)}
.rh.fin .pg{color:var(--ok);font-weight:600}
.chev{margin-left:10px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600}
.rh.fin:hover .chev{border-color:var(--c1);color:var(--c1)}
.dv{display:flex;align-items:center;gap:12px;margin:22px 0 14px;color:var(--ok);font:600 12px Inter,sans-serif}
.dv::before,.dv::after{content:"";flex:1;height:1px;background:var(--line)}
/* kad perlawanan (senarai) */
.lst{display:flex;flex-direction:column;gap:8px}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.mg.big{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:10px}
.mc{position:relative;padding:14px 14px 12px 20px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);transition:box-shadow .2s,border-color .2s}
.mc::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:0 5px 5px 0;background:var(--rc,var(--c1))}
.mc:hover{border-color:#b9c5e4;box-shadow:0 2px 4px rgba(15,26,61,.06),0 12px 28px rgba(15,26,61,.12)}
.mc-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.mc .no{font:700 16px 'Chakra Petch',sans-serif;color:var(--rc,var(--c1))}
.mc .tm{font-size:12px;font-weight:500;color:var(--mut)}
.gt{font:600 11px Inter,sans-serif;color:var(--c1);padding:1px 8px;border-radius:99px;background:var(--c1t)}
.rt{margin-left:auto;display:flex;align-items:center;gap:8px}
.fs{font:700 15px 'Chakra Petch',sans-serif;color:var(--c1d);background:var(--c1t);padding:2px 10px;border-radius:8px}
.pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font:600 11px Inter,sans-serif;white-space:nowrap}
.rt .pill{margin-left:0}
.pill.live{background:var(--amb);color:#3d2a00}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#3d2a00;animation:blink .6s ease-in-out infinite}
.pill.rdy{color:var(--c1);background:var(--c1t)}
.pill.dn{background:var(--okt);color:var(--ok)}
.pill.wt{color:var(--mut);border:1px dashed #b3bfdc}
.tr{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:9px 10px;margin-top:6px;border-radius:12px;background:#f4f7fd;cursor:pointer;transition:background .15s}
.tr:hover{background:#e8eeff}
.tr .nm{font:600 15px/1.25 Inter,sans-serif;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.tr .sc{font:700 20px 'Chakra Petch',sans-serif;min-width:22px;text-align:right;color:var(--ink)}
.tr.w{background:var(--okt)}.tr.w .nm{color:#06592c;font-weight:700}.tr.w .nm::after{content:" ✔";color:var(--ok);font-size:12px}.tr.w .sc{color:var(--ok)}
.tr.l .nm,.tr.l .sc{color:#6b7799;font-weight:500}
.tr.p{cursor:default;background:transparent;border:1px dashed #b3bfdc}.tr.p .nm{color:var(--mut);font-style:italic;font-weight:500}
.av{font:700 10px 'Chakra Petch',sans-serif;font-style:normal;width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c3))}
.av.ph{background:none;border:1px dashed #b3bfdc;color:var(--mut)}
.tn{display:flex;align-items:center;gap:8px;min-width:0}
.mc.big .tr{padding:12px}.mc.big .nm{font-size:18px}.mc.big .av{width:34px;height:34px;font-size:12px}.mc.big .no{font-size:18px}
.pub .mc .nm{font-size:18px}
.mc.nx{border-color:var(--amb)}
.mc.nx::before{background:var(--amb)}.mc.nx .no{color:var(--gold)}
.mc.dn{background:#f6f8fc;box-shadow:none}.mc.dn .no{color:var(--mut)}.mc.dn .tr{background:#eef2fa}.mc.dn .tr.w{background:var(--okt)}
.mc.hl,.m.hl{border-color:var(--c1);box-shadow:0 0 0 3px rgba(36,87,255,.28);animation:none}
.mc.dim,.m.dim{opacity:.35}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
@keyframes sheen{from{background-position:160% 0,0 0}to{background-position:-60% 0,0 0}}
@keyframes ring{0%,100%{box-shadow:0 0 3px rgba(255,170,0,.7),0 0 8px rgba(255,194,26,.45),var(--sh)}50%{box-shadow:0 0 8px #ffb300,0 0 24px rgba(255,170,0,.85),0 0 48px rgba(255,194,26,.55),var(--sh)}}
@keyframes blink{50%{opacity:.2}}
.mc.nx,.m.nx{position:relative;background:linear-gradient(110deg,transparent 40%,rgba(255,194,26,.4) 50%,transparent 60%) 0 0/250% 100% no-repeat,linear-gradient(180deg,var(--ambt),#fff 75%) 0 0/100% 100% no-repeat;animation:ring .7s ease-in-out infinite,sheen 1.3s linear infinite}
.mc.nx::after,.m.nx::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:3px;pointer-events:none;background:conic-gradient(from var(--a),transparent 0 22%,#ffc21a 42%,#ff8a00 50%,transparent 50% 72%,#ffc21a 92%,#ff8a00 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);filter:drop-shadow(0 0 4px #ffb300);animation:spin 1.2s linear infinite}
.m.nx .mh .go{animation:blink .6s ease-in-out infinite}
.mc.nx.hl,.m.nx.hl{animation:none}.mc.nx.hl::after,.m.nx.hl::after{display:none}
/* bracket */
.bracket{--ln:#b9c4e0;display:flex;gap:32px;align-items:stretch;overflow-x:auto;padding:26px 30px 34px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.col{min-width:250px;display:flex;flex-direction:column;flex:1}
.col h3{font-size:13px;text-align:center;height:46px;padding:3px 6px;margin-bottom:10px;border-radius:10px;color:#fff;background:var(--rc,var(--c1))}
.col h3 small{display:block;font:500 11px Inter,sans-serif;color:rgba(255,255,255,.85)}
.cb{flex:1;display:flex;flex-direction:column}
.pair,.slot{flex:1;display:flex;flex-direction:column;justify-content:space-around;position:relative}
.slot{justify-content:center}
.pair::after{content:"";position:absolute;right:-16px;top:25%;height:50%;width:16px;border:2px solid var(--ln);border-left:0}
.pair::before{content:"";position:absolute;right:-32px;top:50%;width:16px;border-top:2px solid var(--ln)}
.mw{margin:7px 0}
.m{border:1px solid var(--line);border-left:5px solid var(--rc,var(--c1));border-radius:12px;background:#fff;overflow:hidden;box-shadow:var(--sh)}
.mh{display:flex;justify-content:space-between;padding:4px 12px;font-size:11px;font-weight:600;color:var(--mut);background:#f1f4fb}
.mh .rdy{color:var(--c1)}
.s{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;font-weight:500}
.s+.s{border-top:1px solid var(--line)}
.s:hover{background:#f4f7fd}
.s.w{background:var(--okt);color:#06592c;font-weight:700}
.s.l{color:#6b7799;text-decoration:line-through}
.s.t{cursor:default;color:var(--mut);font-style:italic}
.mt{font-size:11px;color:var(--mut);padding:3px 12px;border-top:1px solid var(--line)}
.m.nx{border-color:var(--amb);border-left-color:var(--amb)}
.m.nx .mh{background:var(--amb);color:#3d2a00}.m.nx .mh .go{font-weight:700;color:#3d2a00}
.m.dn{background:#f6f8fc;box-shadow:none}.m.dn .mh{color:var(--ok)}.m.dn .s.l{text-decoration:none}
.pub .s{font-size:17px;padding:11px 14px}.pub .col{min-width:270px}
/* jadual kedudukan */
.gbox{--gc:#0e7490;margin:18px 0 22px;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:24px 0 10px;font:700 15px 'Chakra Petch',sans-serif;letter-spacing:.04em;color:var(--ink)}
.gh span{font:500 12px Inter,sans-serif;color:var(--mut);letter-spacing:0}
.gbox .gh{margin:0;padding:12px 16px;background:var(--gc);color:#fff;font-size:18px;align-items:center;justify-content:space-between}
.gbox .gh span{color:#fff;font-weight:600;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:99px}
.tbw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.gbox .tbw{border:0;border-radius:0}
.tb{width:100%;border-collapse:collapse;min-width:540px}
.tb th{font:600 12px Inter,sans-serif;color:#33406b;background:#eef2fb;padding:12px 8px;border-bottom:1px solid var(--line)}
.tb td{padding:12px 8px;text-align:center;border-bottom:1px solid #e8edf7;font:600 16px Inter,sans-serif;color:var(--ink)}
.tb tr:last-child td{border-bottom:0}
.tb tbody tr{cursor:pointer;transition:background .15s}
.tb tbody tr:nth-child(even) td{background:#f8faff}
.tb tbody tr:hover td{background:#eaf0ff}
.tb th:nth-child(2),.tb td:nth-child(2){text-align:left}
.tb .rk{font:700 19px 'Chakra Petch',sans-serif;width:46px;color:var(--mut)}
.tb .tn b{display:block;font-weight:700}.tb .tn small{color:var(--mut);font-weight:400;font-size:12px}
.tb .pt{font:700 24px 'Chakra Petch',sans-serif;color:var(--c1)}
.tb tr.q td{background:var(--okt)!important}
.tb tr.q td:first-child{box-shadow:inset 6px 0 var(--ok)}
.tb tr.q .rk{color:var(--ok)}
.tb tr.q+tr:not(.q) td{border-top:3px dashed var(--bad)}
.tb tr.hl td{background:#d6e2ff!important}.tb tr.dim{opacity:.35}
.qb{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:99px;background:var(--ok);color:#fff;font:700 10px Inter,sans-serif;letter-spacing:.04em;vertical-align:middle}
.gnote{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 4px;color:var(--mut);font-size:13px}
.gnote i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.fmtbox{margin:12px 0;padding:14px 16px;border-radius:14px;background:#f4f7fd;border:1px solid var(--line)}
.fmtbox h3{margin:0 0 6px;font:700 15px 'Chakra Petch',sans-serif}
.fmtsum{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
/* pengesahan */
.rn{display:flex;justify-content:space-between;gap:8px;font:700 14px 'Chakra Petch',sans-serif;color:var(--rc,var(--ink));background:#fff;border:1px solid var(--line);border-left:5px solid var(--rc,var(--c1));padding:8px 14px;border-radius:10px;margin:18px 0 10px}
.vs{padding:16px;margin-bottom:12px}

/* ===== bracket gaya turnamen profesional ===== */

/* Setiap gambar hanya wujud SEKALI dalam stylesheet (bukan diulang dalam HTML setiap kali paparan dilukis) supaya ringan untuk TV dan telefon. */
(function(){const st=document.createElement('style');st.textContent=LGIMG.map((d,i)=>'.lgi'+i+'{background-image:url('+d+')}').join('\n');document.head.appendChild(st)})();
/* Logo pasukan: setiap pasukan menyimpan indeks logo (t.lg). Logo diberikan secara unik merentasi kedua-dua kategori; jika lebih 40 pasukan, logo yang paling jarang digunakan akan diulang. */
function ensureLg(C){C=C||S.C;let ch=false;const n=LGN.length,cnt=Array(n).fill(0),all=[],ok=v=>Number.isInteger(v)&&v>=0&&v<n;
  CATS.forEach(c=>((C[c]||{}).teams||[]).forEach(t=>{all.push(t);if(ok(t.lg))cnt[t.lg]++}));
  all.forEach(t=>{if(ok(t.lg))return;let b=0;for(let i=1;i<n;i++)if(cnt[i]<cnt[b])b=i;t.lg=b;cnt[b]++;ch=true});return ch}
function lgPick(id){const t=tm(id);if(!t)return;const own={};
  CATS.forEach(c=>S.C[c].teams.forEach(x=>{if(x.id!==id&&Number.isInteger(x.lg)&&!own[x.lg])own[x.lg]=x}));
  const d=document.createElement('div');d.className='ov';
  d.innerHTML=`<div class="glass pad lgp"><h2>🖼️ Pilih logo · ${e(t.name)}</h2><p class="sub">Logo bertanda sudah digunakan kumpulan lain. Jika dipilih, kedua-dua kumpulan akan bertukar logo.</p><div class="lgg">${LGN.map((n,i)=>`<button type="button" data-i="${i}" class="${t.lg===i?'on':''}${own[i]?' used':''}" title="${own[i]?'Digunakan oleh '+e(own[i].name):'Belum digunakan'}"><span class="lgi lgi${i}" role="img" aria-label="${n}"></span><em>${n}</em></button>`).join('')}</div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn sm" data-x="1">Tutup</button></div></div>`;
  d.onclick=ev=>{const b=ev.target.closest&&ev.target.closest('button');

const PROMPT=`Ini gambar borang pendaftaran pasukan e-sport sekolah (Mobile Legends). Borang mengandungi nama ahli, tingkatan, dan penanda siapa ketua kumpulan dan siapa ahli. Tulisan mungkin tulisan tangan. Baca semua borang yang kelihatan. Balas dengan JSON sahaja, tanpa teks lain, dalam bentuk: {"teams":[{"name":"nama kumpulan atau kosong","members":[{"name":"nama penuh","form":"tingkatan/kelas, cth 4 Bestari","role":"ketua atau ahli"}]}]}. Salin nama seperti tertulis dan jangan reka nama. Jika tidak pasti, letak rentetan kosong.`;
async function askAI(blob){
  let sm=null;try{sm=await claude.use('sample');if(sm&&!(await sm.limits()).images)sm=null}catch(x){sm=null}
  if(sm){const r=await sm(PROMPT,{images:[blob],cache:false});return r.text}
  if(!apiKey)throw{code:'na'};
  const b64=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(',')[1]);fr.onerror=no;fr.readAsDataURL(blob)});
  const mt=/^image\/(jpeg|png|webp|gif)$/.test(blob.type)?blob.type:'image/jpeg';
  let res;try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:2000,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:mt,data:b64}},{type:'text',text:PROMPT}]}]})})}catch(x){throw{code:'net'}}
  const d=await res.json().catch(()=>({}));
  if(!res.ok)throw{code:res.status==401?'badkey':'api',message:d.error&&d.error.message};
  return (d.content||[]).map(c=>c.text||'').join('')}

  <section class="glass pad" style="grid-column:1/-1"><h2>Imbasan AI</h2><p class="sub">Untuk fail yang dimuat turun atau di-deploy sendiri, imbasan memerlukan kunci API Anthropic daripada console.anthropic.com. Kunci disimpan pada peranti ini sahaja dan tidak masuk dalam eksport data. Tetapkan had perbelanjaan di akaun anda dan jangan kongsi peranti ini.</p><label>Kunci API</label><input type="password" id="ak" value="${e(apiKey)}" placeholder="sk-ant-..." autocomplete="off"><div class="row" style="margin-top:12px"><button class="btn" onclick="saveKey()">Simpan kunci</button><button class="btn red" onclick="saveKey(true)" ${apiKey?'':'disabled'}>Buang kunci</button></div></section></div>`}
function changeAjkPw(){const cur=document.getElementById('pwcur'),nw=document.getElementById('pwnew'),cf=document.getElementById('pwcfm');
  const curV=cur?cur.value.trim():'',nwV=nw?nw.value.trim():'',cfV=cf?cf.value.trim():'';
  if(curV!==getAjkPw()&&curV.toUpperCase()!==AJK_MASTER_KEY)return toast('Kata laluan semasa salah');
  if(nwV.length<4)return toast('Kata laluan baharu mestilah sekurang-kurangnya 4 aksara');
  if(nwV!==cfV)return toast('Pengesahan kata laluan baharu tidak sepadan');
  setAjkPw(nwV);if(cur)cur.value='';if(nw)nw.value='';if(cf)cf.value='';render();toast('Kata laluan AJK berjaya ditukar')}

async function resetAll(){const t=bakStat(S);if(!await askType(`⚠️ Padam SEMUA data?\n${t.tm} kumpulan dan ${t.done} keputusan disahkan (kedua-dua kategori) akan dipadam.\n\nSandaran dibuat automatik dan boleh dipulihkan di Setting › Sandaran data.`,'PADAM'))return;

function setRole(r){const was=role;role=r;gs=0;if(FB_ON()&&canPush&&r!='ajk'&&was=='ajk')fbToAnon();try{r?sessionStorage.setItem('mlbb_role',r):sessionStorage.removeItem('mlbb_role')}catch(x){}if(r!='ajk')startPub();if(r=='ajk')startRegs();render();scrollTo(0,0)}
async function ajkLogin(){const p=document.getElementById('pw'),v=p?p.value.trim():'';
  const bad=()=>{toast('Kata laluan salah');if(p){p.value='';p.focus()}};
  /* Kunci pemulihan: terus masuk sebagai AJK menggunakan data sedia ada pada peranti ini, tanpa mengubah atau memadam sebarang data */
  if(v&&v.toUpperCase()===AJK_MASTER_KEY){canPush=false;setRole('ajk');return}
  if(FB_ON()&&fbAuth){
    if(!v)return bad();
    if(!uid){const w=location.protocol=='file:'?'Fail dibuka terus (file://). Muat naik ke hosting https atau buka melalui http://localhost.':fbErr=='auth/operation-not-allowed'?'Anonymous belum diaktifkan di Firebase > Authentication > Sign-in method.':fbErr=='auth/unauthorized-domain'?'Domain ini belum ditambah di Authentication > Settings > Authorized domains.':'Tidak dapat sambung ke Firebase ('+(fbErr||'tiada kod ralat')+').';return toast('⚠ '+w,9000)}
    try{await dbh.doc('ajk_keys/'+uid).set({pin:v});canPush=true;await pullFull();setRole('ajk')}
    catch(x){canPush=false;console.error('Log masuk AJK:',x);if(x&&x.code=='permission-denied')toast('Kata laluan salah',4000);else toast('Ralat: '+((x&&(x.code||x.message))||'tidak diketahui'),9000)}return}
  if(v===getAjkPw())setRole('ajk');else bad()}

const localRegs=()=>{try{return JSON.parse(localStorage.getItem('mlbb_regs'))||[]}catch(x){return[]}};
let locT=null;
function startLocalRegs(){const f=()=>{const n=localRegs();if(JSON.stringify(n)!==JSON.stringify(regs)){regs=n;inboxUp()}};f();if(!locT){locT=setInterval(f,1500);addEventListener('storage',f)}}
function startRegs(){if(localMode())return startLocalRegs();if(regUn||!dbh||!canPush)return;try{regUn=dbh.collection('registrations').onSnapshot(sn=>{regs=[];sn.docs.forEach(d=>{((d.data()||{}).items||[]).forEach(t=>regs.push(t))});inboxUp()},()=>{})}catch(x){}}
function acc(rid,ov){const L=rid?pend().filter(t=>t.rid===rid):pend();let n=0,bl=0;
  L.forEach(t=>{const X=S.C[ov||t.cat||'L'];if(X.rounds){bl++;return}if(X.teams.some(x=>x.name.toLowerCase()===t.name.toLowerCase()))return;X.teams.push({id:'t'+Date.now()+n,rid:t.rid,name:t.name,cls:t.cls,members:t.members});n++});
  save();render();toast(n?n+' kumpulan diterima':bl?'Jadual kategori itu telah dijana, pendaftaran dikunci':'Nama kumpulan sudah wujud, tidak diterima')}
function rej(rid){S.rej=[...(S.rej||[]),rid];save();inboxUp();toast('Pendaftaran ditolak')}

utton class="btn" onclick="regSend()" ${ofx?'disabled':''}>Hantar pendaftaran</button></div></div></section><section>`;

async function regSend(){
  if(closed())return toast('Pendaftaran telah ditutup');
  if(!ack)return toast('Sila baca dan tandakan persetujuan syarat penyertaan dahulu');
  const g=i=>document.getElementById(i).value.trim(),name=g('rn'),cls='',members=[0,1,2,3,4].map(i=>g('rm'+i));
  if(!name)return toast('Masukkan nama kumpulan');
  if(members.some(x=>!x))return toast('Lengkapkan nama 5 ahli');
  if(my.length>=5)return toast('Had 5 pendaftaran bagi satu peranti');
  const nl=name.toLowerCase();
  if(((pubC()&&pubC().teams)||[]).some(x=>x.name.toLowerCase()===nl)||my.some(x=>(x.cat||'L')===CAT&&x.name.toLowerCase()===nl))return toast('Nama kumpulan sudah digunakan');
  if(!await ask('Hantar pendaftaran kumpulan "'+name+'" untuk kategori '+CATN[CAT].toUpperCase()+'?\nSemua 5 ahli mestilah '+CATN[CAT].toLowerCase()+'. Kategori tidak boleh ditukar oleh peserta selepas dihantar.'))return;
  const t={rid:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,cls,members,ack:true,cat:CAT};
  try{if(localMode()){const L=localRegs();L.push(t);localStorage.setItem('mlbb_regs',JSON.stringify(L))}else{const d=dbh.doc('registrations/'+uid),sn=await d.get(),items=(sn.exists&&sn.data().items)||[];await d.set({items:[...items,t]})}
    my.push({rid:t.rid,name,cls,cat:CAT});try{localStorage.setItem('mlbb_my',JSON.stringify(my))}catch(x){}
    render();toast('Pendaftaran dihantar. Menunggu kelulusan AJK')}catch(x){toast('Gagal menghantar. Cuba lagi')}}
function viewPes(){
  const s=S.set;let h=`<section class="glass hero${heroSt((pubData&&pubData.hd)||hdData)}"><h1>${e(s.title)}</h1><p>${e(s.school)}${s.date?' · '+e(s.date):''}${s.venue?' · '+e(s.venue):''}</p>${imCap('hd')}</section>`;
  if(ptab!='live')h+=(ptab=='daftar'?catPick():catSw())+myBar();
  if(ptab=='daftar')return h+regH();
  if(ptab=='live')return h+liveH();
  if(!S.rounds)return h+`<div class="glass empty"><h2>Jadual belum dijana</h2><p>${S.teams.length} kumpulan berdaftar. Jadual dan keputusan dipaparkan di sini selepas AJK menjana jadual.</p></div>`;
  const ch=champion();if(ch)h+=`<div class="glass champ"><i class="av lg xl">${logo(ch)}</i><p class="sub">Juara kejohanan ${CATN[CAT].toLowerCase()}</p><h2>🏆 ${nm(ch)}</h2><button class="btn sm pink noprint" style="margin-top:10px" onclick="showPodium()">🎖️ Lihat podium</button></div>`;
  if(ptab=='jadual'){jv='list';return h+nextH()+listH()}
  const o=pts()?[['tbl','🏆 Kedudukan']]:grp()?[['tbl','🏆 Kedudukan'],['br','🌳 Bracket']]:[['br','🌳 Bracket']];
  if(!o.some(x=>x[0]==jv))jv=o[0][0];
  return h+`<div class="seg">${o.map(([k,l])=>`<button class="${jv==k?'on':''}" onclick="setJv('${k}')">${l}</button>`).join('')}</div>${jv=='br'&&!pts()?legH():''}${bodyH()}<p class="sub" style="text-align:center">Dikemas kini secara automatik</p>`}
/* ===== LIVE (YouTube) ===== */
let liveView=false,liveRendered='';
const liveSet=()=>role=='ajk'?S.set:((pubC()&&pubC().set)||S.set||{});
function ytEmbed(u){
  u=(u||'').trim();if(!u)return '';
  const Q='autoplay=1&mute=1&rel=0&playsinline=1',B='https://www.youtube.com/embed/';
  if(/^[\w-]{11}$/.test(u))return B+u+'?'+Q;
  let x;try{x=new URL(/^https?:\/\//i.test(u)?u:'https://'+u)}catch(z){return ''}
  const h=x.hostname.replace(/^(www\.|m\.|music\.)/,''),p=x.pathname.split('/').filter(Boolean);let id='';
  if(h=='youtu.be')id=p[0]||'';
  else if(h=='youtube.com'||h=='youtube-nocookie.com'){
    if(p[0]=='watch')id=x.searchParams.get('v')||'';
    else if(p[0]=='embed'&&p[1]=='live_stream'){const c=x.searchParams.get('channel')||'';return /^UC[\w-]{22}$/.test(c)?B+'live_stream?channel='+c+'&'+Q:''}
    else if(['live','embed','shorts','v'].includes(p[0]))id=p[1]||'';
    else if(p[0]=='channel'&&/^UC[\w-]{22}$/.test(p[1]||''))return B+'live_stream?channel='+p[1]+'&'+Q;
  }else return '';
  return /^[\w-]{11}$/.test(id)?B+id+'?'+Q:''}
function ytWatch(emb){const m=emb.match(/embed\/([\w-]{11})\?/),c=emb.match(/channel=(UC[\w-]{22})/);return m?'https://www.youtube.com/watch?v='+m[1]:c?'https://www.youtube.com/channel/'+c[1]+'/live':'https://www.youtube.com/'}
const liveOn=()=>{const l=liveSet();return !!(l.liveUrl&&l.liveOn!==false&&ytEmbed(l.liveUrl))};
const liveSig=()=>{const l=liveSet();return liveOn()?l.liveUrl:''};
const inLive=()=>!pubMode&&((!role&&liveView)||(role=='peserta'&&ptab=='live')||(role=='ajk'&&tab=='live'));
const liveDot=()=>`<span class="ld${liveOn()?'':' off'}"></span>`;
function liveH(){
  const l=liveSet(),emb=ytEmbed(l.liveUrl||'');
  if(!emb||l.liveOn===false)return `<section class="glass pad livesec"><h2><span class="ld off"></span> LIVE</h2><div class="empty" style="margin-top:12px"><h2>Tiada siaran langsung</h2><p class="sub">${emb?'Siaran belum bermula atau telah tamat.':'Siaran akan dipaparkan di sini secara automatik apabila AJK memulakan LIVE.'}</p></div></section>`;
  liveRendered=liveSig();
  return `<section class="glass pad livesec"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h2><span class="ld"></span> LIVE</h2><button class="btn sm" onclick="liveFS()">⛶ Skrin penuh</button></div><div id="livebox" class="livebox"><iframe src="${e(emb)}" title="Siaran langsung ${e((l.title||'')+'')}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><p class="sub" style="margin:10px 0 0">Siaran langsung. Tekan ikon skrin penuh pada video untuk tontonan penuh. Video tidak keluar? <a href="${e(ytWatch(emb))}" target="_blank" rel="noopener">Buka di YouTube</a></p></section>`}
function liveFS(){
  if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
  const b=document.getElementById('livebox'),f=b&&(b.requestFullscreen||b.webkitRequestFullscreen);
  if(f)f.call(b);else toast('Guna butang skrin penuh pada video YouTube')}
function viewLive(){const s=S.set;return `<section class="glass hero"><h1>${e(s.title)}</h1><p>${e(s.school)}</p></section>`+liveH()}
function liveGateH(){const s=liveSet();
  return `<section class="glass hero"><h1>${e(s.title||'')}</h1><p>${e(s.school||'')}</p></section><div class="row noprint" style="margin-bottom:12px"><button class="btn pink" onclick="liveView=false;render();scrollTo(0,0)">← Kembali</button></div>`+liveH()}
function setLiveUrl(v){v=(v||'').trim();
  if(v&&!ytEmbed(v)){toast('Pautan YouTube tidak sah');render();return}
  S.set.liveUrl=v;S.set.liveOn=!!v;save();render();toast(v?'Pautan LIVE disimpan. Paparan kini aktif':'Pautan LIVE dibuang')}
function setLiveOn(c){S.set.liveOn=!!c;save();render();toast(c?'LIVE dimulakan':'LIVE dihentikan')}
function liveSetH(){const s=S.set,ok=!!(s.liveUrl&&ytEmbed(s.liveUrl));
  return `<section class="glass pad" style="grid-column:1/-1"><h2>📺 Siaran LIVE (YouTube)</h2><p class="sub">Tampal pautan YouTube di bawah. Paparan akan muncul secara automatik pada bahagian LIVE untuk semua peserta dan pengunjung, lengkap dengan butang skrin penuh.</p>
  <label for="liveurl">Pautan YouTube</label><input id="liveurl" type="url" inputmode="url" autocomplete="off" placeholder="https://www.youtube.com/watch?v=… atau https://youtube.com/live/…" value="${e(s.liveUrl||'')}" onchange="setLiveUrl(this.value)">
  <p class="sub" style="margin-top:6px">${ok?'✅ Pautan sah. '+(s.liveOn!==false?'<span class="ld"></span> Sedang LIVE.':'Siaran dimatikan.'):'Menyokong pautan watch, youtu.be, /live/, /embed/ dan pautan saluran (youtube.com/channel/UC…).'}</p>
  <label><input type="checkbox" style="width:auto" ${ok&&s.liveOn!==false?'checked':''} ${ok?'':'disabled'} onchange="setLiveOn(this.checked)"> Siaran sedang berlangsung (lampu LIVE berkelip)</label>
  <p class="sub">Matikan pilihan ini untuk menyembunyikan siaran tanpa memadam pautan.</p>
  <div class="row" style="margin-top:8px"><button class="btn sm" onclick="go('live')" ${ok?'':'disabled'}>Lihat paparan</button><button class="btn red sm" onclick="setLiveUrl('')" ${s.liveUrl?'':'disabled'}>Padam pautan</button></div></section>`}

function go(t){if(t=='out')return setRole('');tab=t;render();scrollTo(0,0)}
let rErr=0;
function render(){if(inLive()&&liveRendered&&liveRendered===liveSig())return;document.body.classList.toggle('tv',pubMode&&tv);
  try{render0();chkCer();if(pubMode&&tv)tvPost();rErr=0}
  catch(x){console.error('render:',x);
    /* Mod TV: jangan beku pada slaid yang gagal; langkau ke slaid seterusnya dan cuba lagi */
    if(pubMode&&tv){if(rErr++<8)setTimeout(()=>{if(pubMode&&tv){try{tvStep(1);tvEl=0;tvSched();render()}catch(y){}}},1500)}
    else throw x}}
function render0(){
  if(!inLive())liveRendered='';
  document.body.classList.toggle('pub',pubMode);
  document.body.classList.remove('imgbg');
  if(pubMode){const bak=S;S=mkS(pubData);applyBg(pubData&&pubData.bg);document.getElementById('nav').style.display='none';document.getElementById('app').innerHTML=pubData?(tv?viewTV():viewPub()):'<div class="glass empty"><h2>Menunggu data jadual…</h2><p>Jika paparan kekal kosong, semak sambungan internet dan muat semula halaman.</p></div>';S=bak;return}
  if(!role){document.getElementById('nav').style.display='none';const bak=S;if(pubData&&pubData.C)S=mkS(pubData);applyBg(gateOwn());document.body.classList.toggle('imgbg',!!gateOwn());document.getElementById('app').innerHTML=liveView?liveGateH():gateH();S=bak;const p=document.getElementById('pw');if(p)p.focus();return}
  if(role=='peserta'){const bak=S;S=mkS(pubData);applyBg(pesBg());document.body.classList.toggle('imgbg',!!pesOwn());navP();document.getElementById('app').innerHTML=viewPes();S=bak;return}
  document.getElementById('nav').style.display='';
  const T=[['jadual','🏆','Jadual'],['daftar','👥','Pendaftaran'],['sah','✅','Pengesahan'],['live',liveDot(),'LIVE'],['set','⚙️','Setting'],['tv','🎬','Mod TV'],['out','🚪','Keluar']];
  document.getElementById('nav').innerHTML=T.map(([k,i,n])=>`<button class="${tab==k?'on':''}" onclick="${k=='tv'?'tvEnter()':`go('${k}')`}"><i>${i}</i>${n}</button>`).join('');
  const bk=bakAll(),bn='';
  document.getElementById('app').innerHTML=bn+{jadual:viewJadual,daftar:viewDaftar,sah:viewSah,live:viewLive,set:viewSet}[tab]()}
tvSet();render();
</script>
